<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify Record</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Chakra Petch', sans-serif;
        }

        body {
            background-color: #0c0d10;
            color: #c9d1d9;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            position: relative;
            padding: 40px;
            background: rgba(18, 20, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Tactical corner brackets */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 16px;
            height: 16px;
            border-top: 3px solid #f59e0b;
            border-left: 3px solid #f59e0b;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 16px;
            height: 16px;
            border-bottom: 3px solid #f59e0b;
            border-right: 3px solid #f59e0b;
        }

        .system-tag {
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            color: #f59e0b;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #f59e0b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            background: #14171d;
            border: 1px solid #232730;
            color: #ffffff;
            padding: 12px 14px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #f59e0b;
            background: #181c24;
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 35px;
        }

        .btn-update {
            background: transparent;
            color: #f59e0b;
            border: 2px solid #f59e0b;
            padding: 10px 24px;
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-update:hover {
            background: #f59e0b;
            color: #0c0d10;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        .cancel-link {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 14px;
            color: #8b949e;
            text-decoration: none;
            transition: color 0.2s;
        }

        .cancel-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="system-tag">SYSTEM // RECORD_MODIFY :: ID-{{ '%04d' | format(student.id) }}</div>
        <h1>Edit Student Details</h1>

        <form action="/edit/{{ student.id }}" method="POST">
            <div class="form-group">
                <label for="name">FULL NAME</label>
                <input type="text" id="name" name="name" value="{{ student.name }}" required>
            </div>

            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" value="{{ student.email }}" required>
            </div>

            <div class="form-group">
                <label for="matric_number">MATRIC NUMBER</label>
                <input type="text" id="matric_number" name="matric_number" value="{{ student.matric_number }}" required>
            </div>

            <div class="form-group">
                <label for="department">DEPARTMENT</label>
                <input type="text" id="department" name="department" value="{{ student.department }}" required>
            </div>

            <div class="form-group">
                <label for="faculty">FACULTY</label>
                <input type="text" id="faculty" name="faculty" value="{{ student.faculty }}" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-update">[ UPDATE ]</button>
                <a href="/" class="cancel-link">cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
